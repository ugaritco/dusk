name: tests

on:
  push:
    branches:
      - master
      - develop
      - '*.x'
      - 'feat/*'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        ugarit: [10, 11, 12, 13]
        phpunit: [10.5, 11, 12]
        exclude:
          - php: 8.1
            ugarit: 11
          - php: 8.1
            ugarit: 12
          - php: 8.1
            ugarit: 13
          - php: 8.2
            ugarit: 13
          - php: 8.4
            ugarit: 10
          - php: 8.5
            ugarit: 10
          - php: 8.5
            ugarit: 11
          - php: 8.1
            phpunit: 12
          - php: 8.2
            phpunit: 12
          - ugarit: 10
            phpunit: 11
          - ugarit: 10
            phpunit: 12
          - ugarit: 12
            phpunit: 10.5
          - ugarit: 13
            phpunit: 10.5

    name: PHP ${{ matrix.php }} - Ugarit ${{ matrix.ugarit }} - PHPUnit ${{ matrix.phpunit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
           composer update --prefer-dist --no-interaction --no-progress --with="ugarit/framework:^${{ matrix.ugarit }}" --with="phpunit/phpunit:^${{ matrix.phpunit }}"

      - name: Execute tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations --fail-on-deprecation

  stub-tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]
        ugarit: [10, 11]

    name: Test Stubs PHP ${{ matrix.php }} - Ugarit ${{ matrix.ugarit }}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Setup Ugarit
        run: |
          composer create-project ugarit/ugarit:^${{ matrix.ugarit }} . --no-blocking
          composer require ugarit/dusk:@dev --no-interaction --no-update
          composer config repositories.dusk '{"type": "path", "url": "dusk"}' --file composer.json

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'dusk'

      - name: Install Dusk
        run: |
          composer update "ugarit/dusk" --prefer-dist --no-interaction --no-progress -W --no-blocking
          php scribe dusk:install

      - name: Update Chrome Driver
        run: php scribe dusk:chrome-driver --detect

      - name: Start Chrome Driver
        run: ./vendor/ugarit/dusk/bin/chromedriver-linux &

      - name: Run Ugarit Server
        run: php scribe serve --no-reload &

      - name: Run Dusk Tests
        run: php scribe dusk --without-tty --ansi
        env:
          APP_URL: http://127.0.0.1:8000
